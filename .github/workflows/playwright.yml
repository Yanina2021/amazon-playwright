name: Playwright Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: https://www.amazon.com
          PRODUCT_SEARCH: zapatos
          BRAND_FILTER: skechers
          HIGT_PRICE_OPTION: price-desc-rank
          HIGT_PRICE_COMMENT: Top 5 por precio más alto
          NEW_RELEASES_OPTION: date-desc-rank
          NEW_RELEASES_COMMENT: Top 5 por nuevos lanzamientos
          REVIEW_RANK_OPTION: review-rank
          REVIEW_RANK_COMMENT: Top 5 por promedio de comentarios

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7