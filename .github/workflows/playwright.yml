name: Playwright Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  BASE_URL: ${{ vars.BASE_URL }}
  PRODUCT_SEARCH: ${{ vars.PRODUCT_SEARCH }}
  BRAND_FILTER: ${{ vars.BRAND_FILTER }}
  HIGT_PRICE_OPTION: ${{ vars.HIGT_PRICE_OPTION }}
  HIGT_PRICE_COMMENT: ${{ vars.HIGT_PRICE_COMMENT }}
  NEW_RELEASES_OPTION: ${{ vars.NEW_RELEASES_OPTION }}
  NEW_RELEASES_COMMENT: ${{ vars.NEW_RELEASES_COMMENT }}
  REVIEW_RANK_OPTION: ${{ vars.REVIEW_RANK_OPTION }}
  REVIEW_RANK_COMMENT: ${{ vars.REVIEW_RANK_COMMENT }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7